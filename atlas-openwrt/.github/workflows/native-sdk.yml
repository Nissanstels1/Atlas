name: Native OpenWrt packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        release: [24.10.1, 25.12.0]
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-venv rsync unzip zlib1g-dev file wget zstd
      - name: Fetch verified official SDK and build
        env:
          OPENWRT_RELEASE: ${{ matrix.release }}
        run: |
          sdk=$(python3 tools/fetch-sdk.py "$OPENWRT_RELEASE" x86/64 "$RUNNER_TEMP/atlas-sdk")
          python3 tools/build-sdk.py "$sdk" --jobs 2 --update-feeds
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-openwrt-${{ matrix.release }}
          path: dist/sdk/*
          if-no-files-found: error
