name: Publish verified Atlas 0.28 beta
on:
  push:
    branches: [main]
    paths: ['releases/atlas-0.28/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-028-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested bundle and expose application source
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,re,zipfile,io
          root=pathlib.Path('releases/atlas-0.28');meta=json.loads((root/'manifest.json').read_text())
          out=pathlib.Path('publish');out.mkdir()
          chunks=[]
          for part in meta['parts']:
              assert re.fullmatch(r'part-[0-9]{3}\.bin',part['name'])
              data=(root/part['name']).read_bytes()
              assert len(data)==part['size'] and hashlib.sha256(data).hexdigest()==part['sha256']
              chunks.append(data)
          data=b''.join(chunks)
          assert hashlib.sha256(data).hexdigest()==meta['sha256']
          kit=out/'atlas-0.28-complete-x86_64.zip';kit.write_bytes(data)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None
              for name in z.namelist():
                  assert re.fullmatch(r'[A-Za-z0-9_.+-]+',name)
                  (out/name).write_bytes(z.read(name))
          for line in (out/'SHA256SUMS-0.28').read_text().splitlines():
              expected,name=line.split('  ',1)
              assert hashlib.sha256((out/name).read_bytes()).hexdigest()==expected
          source=out/'atlas-openwrt-0.28.0-beta.zip'
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None
              for entry in z.infolist():
                  path=pathlib.PurePosixPath(entry.filename)
                  assert path.parts[0]=='atlas-openwrt' and '..' not in path.parts
                  if len(path.parts)>1 and path.parts[1]=='dist':continue
                  destination=pathlib.Path(*path.parts)
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(z.read(entry))
                  destination.chmod((entry.external_attr>>16)&0o777 or 0o644)
          assets=sorted(p for p in out.iterdir() if p.name not in ('SHA256SUMS','SHA256SUMS-0.28'))
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in assets))
          PY
      - name: Commit browsable source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-openwrt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Atlas 0.28 application source'
            git push origin HEAD:main
          fi
          echo "ATLAS_RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish verified packages, corresponding engine source and evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const tag='v0.28.0-beta';
            let release;
            try {release=(await github.rest.repos.getReleaseByTag({...context.repo,tag})).data;}
            catch(e) {if(e.status!==404)throw e;release=(await github.rest.repos.createRelease({...context.repo,tag_name:tag,target_commitish:process.env.ATLAS_RELEASE_COMMIT,name:'Atlas 0.28 beta · Atlas Engine r3',prerelease:true,body:fs.readFileSync('publish/Atlas-0.28-report.md','utf8')})).data;}
            const files=fs.readdirSync('publish');
            const existing=(await github.rest.repos.listReleaseAssets({...context.repo,release_id:release.id,per_page:100})).data;
            for(const name of files){
              const old=existing.find(x=>x.name===name);
              if(old)await github.rest.repos.deleteReleaseAsset({...context.repo,asset_id:old.id});
              await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name,data:fs.readFileSync('publish/'+name)});
            }

