name: Publish verified Atlas beta
on:
  push:
    branches: [main]
    paths: ['releases/atlas-openwrt-0.22.0-beta.zip', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-022-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and extract tested packages
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          root=pathlib.Path('releases'); archive=root/'atlas-openwrt-0.22.0-beta.zip'
          digest=(root/'source.sha256').read_text().split()[0]
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==digest
          out=pathlib.Path('publish');out.mkdir()
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for name in ['luci-app-atlas_0.22.0-1_all.ipk','luci-app-atlas-0.22.0-r1.apk']:
                  (out/name).write_bytes(z.read('atlas-openwrt/dist/'+name))
              (out/'install-release.sh').write_bytes(z.read('atlas-openwrt/tools/install-release.sh'))
              (out/'notes.md').write_bytes(z.read('atlas-openwrt/docs/release-0.22.md'))
          (out/archive.name).write_bytes(archive.read_bytes())
          assets=sorted(p for p in out.iterdir() if p.name!='notes.md')
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in assets))
          PY
      - name: Publish packages, source and checksums
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const tag='v0.22.0-beta';
            let release;
            try {release=(await github.rest.repos.getReleaseByTag({...context.repo,tag})).data;}
            catch(e) {if(e.status!==404)throw e;release=(await github.rest.repos.createRelease({...context.repo,tag_name:tag,target_commitish:context.sha,name:'Atlas 0.22 beta',prerelease:true,body:fs.readFileSync('publish/notes.md','utf8')})).data;}
            const files=fs.readdirSync('publish').filter(x=>x!=='notes.md');
            const existing=(await github.rest.repos.listReleaseAssets({...context.repo,release_id:release.id,per_page:100})).data;
            for(const name of files){
              const old=existing.find(x=>x.name===name);
              if(old)await github.rest.repos.deleteReleaseAsset({...context.repo,asset_id:old.id});
              await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name,data:fs.readFileSync('publish/'+name)});
            }
            // Alternate raw.githubusercontent.com delivery uses the same verified bytes.
            // It is another download endpoint, not an independent hosting provider.
            for(const name of files){
              const path='mirror/v0.22.0-beta/'+name;
              let sha;
              try {sha=(await github.rest.repos.getContent({...context.repo,path,ref:'main'})).data.sha;}
              catch(e){if(e.status!==404)throw e;}
              await github.rest.repos.createOrUpdateFileContents({...context.repo,path,branch:'main',sha,message:'Mirror verified Atlas 0.22 asset: '+name,content:fs.readFileSync('publish/'+name).toString('base64')});
            }
